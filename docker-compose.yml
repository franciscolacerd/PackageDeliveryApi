services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      RunMigrations: "true"
      ConnectionStrings__PackageDeliveryConnection: "Server=sql,1433;Database=PackageDelivery;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      BaseUrl__Uri: "http://localhost:8080"
      Serilog__WriteTo__0__Args__path: "/app/logs/PackageDeliveryApi.txt"
    volumes:
      - ./logs:/app/logs

volumes:
  sqldata:
